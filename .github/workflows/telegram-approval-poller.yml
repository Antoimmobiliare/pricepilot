name: PricePilot Telegram approval poller

on:
  schedule:
    # Every five minutes, shifted away from the top of the hour.
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricepilot-telegram-approval-poller
  cancel-in-progress: false

jobs:
  telegram-approval-poller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRICEPILOT_RUNTIME: worker
      PRICEPILOT_ENV: production
      PRICEPILOT_DATABASE_BACKEND: supabase
      PRICEPILOT_OPERATIONAL_MODE: approval
      PRICEPILOT_ALLOW_CHANNEL_WRITES: ${{ vars.PRICEPILOT_ALLOW_CHANNEL_WRITES || '0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BEDS24_LUMA_TOKEN: ${{ secrets.BEDS24_LUMA_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PricePilot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${TELEGRAM_BOT_TOKEN:?Missing repository secret TELEGRAM_BOT_TOKEN}"
          : "${SUPABASE_URL:?Missing repository secret SUPABASE_URL}"
          : "${SUPABASE_ANON_KEY:?Missing repository secret SUPABASE_ANON_KEY}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Missing repository secret SUPABASE_SERVICE_ROLE_KEY}"
          : "${BEDS24_LUMA_TOKEN:?Missing repository secret BEDS24_LUMA_TOKEN}"

      - name: Process one bounded Telegram batch
        run: python -m pricepilot.services.telegram_poller --batch-limit 50

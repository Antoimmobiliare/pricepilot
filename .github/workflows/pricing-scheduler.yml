name: PricePilot cloud scheduler

on:
  schedule:
    # Evita l'inizio dell'ora, quando GitHub può ritardare i job pianificati.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pricepilot-cloud-scheduler
  cancel-in-progress: false

jobs:
  pricing-cycle:
    name: Run pricing cycle
    # Il cron resta pronto ma non chiama Beds24 prima del go-live.
    # Il dispatch manuale continua a funzionare per il collaudo controllato.
    if: github.event_name == 'workflow_dispatch' || vars.PRICEPILOT_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the PricePilot API
        env:
          PRICEPILOT_API_BASE_URL: ${{ secrets.PRICEPILOT_API_BASE_URL }}
          PRICEPILOT_SCHEDULER_KEY: ${{ secrets.PRICEPILOT_SCHEDULER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PRICEPILOT_API_BASE_URL:?Missing repository secret PRICEPILOT_API_BASE_URL}"
          : "${PRICEPILOT_SCHEDULER_KEY:?Missing repository secret PRICEPILOT_SCHEDULER_KEY}"

          # A timeout can occur after price writes. Do not replay the POST automatically.
          response_file="${RUNNER_TEMP}/pricepilot-cycle-response.json"
          curl --fail --show-error --silent \
            --connect-timeout 20 --max-time 240 \
            -X POST "${PRICEPILOT_API_BASE_URL%/}/internal/scheduled-pricing-cycle" \
            -H "X-PricePilot-Scheduler-Key: ${PRICEPILOT_SCHEDULER_KEY}" \
            -H "Accept: application/json" \
            --output "$response_file"
          python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              result = json.load(source)
          if result.get("ok") is not True or result.get("errors"):
              raise SystemExit("Pricing cycle incomplete; inspect authenticated operation logs.")
          print("Pricing cycle completed.")
          PY

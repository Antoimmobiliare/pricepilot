name: PricePilot cloud scheduler

on:
  schedule:
    # Evita l'inizio dell'ora, quando GitHub può ritardare i job pianificati.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricepilot-cloud-scheduler
  cancel-in-progress: false

jobs:
  pricing-cycle:
    name: Run pricing cycle
    # Il cron resta pronto ma non chiama Beds24 prima del go-live.
    # Il dispatch manuale continua a funzionare per il collaudo controllato.
    if: github.event_name == 'workflow_dispatch' || vars.PRICEPILOT_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRICEPILOT_RUNTIME: worker
      PRICEPILOT_ENV: production
      PRICEPILOT_DATABASE_BACKEND: supabase
      PRICEPILOT_OPERATIONAL_MODE: approval
      PRICEPILOT_PRICING_BASIS: calendar_only
      PRICEPILOT_OCCUPANCY_PROVIDER: observed_inventory
      PRICEPILOT_CHANNEL_PROVIDER: beds24
      # Analysis never writes, even when the separately approved Telegram worker
      # has its master gate enabled. No dependency on a long-lived Render request.
      PRICEPILOT_ALLOW_CHANNEL_WRITES: '0'
      PRICEPILOT_HORIZON_DAYS: '90'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BEDS24_LUMA_TOKEN: ${{ secrets.BEDS24_LUMA_TOKEN }}
      BEDS24_LUMA_REFRESH_TOKEN: ${{ secrets.BEDS24_LUMA_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PricePilot dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing repository secret SUPABASE_URL}"
          : "${SUPABASE_ANON_KEY:?Missing repository secret SUPABASE_ANON_KEY}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Missing repository secret SUPABASE_SERVICE_ROLE_KEY}"
          : "${TELEGRAM_BOT_TOKEN:?Missing repository secret TELEGRAM_BOT_TOKEN}"
          : "${BEDS24_LUMA_REFRESH_TOKEN:?Missing repository secret BEDS24_LUMA_REFRESH_TOKEN}"

      - name: Run one scoped approval-only cycle
        run: |
          python - <<'PY'
          import json, logging
          logger = logging.getLogger('pricepilot.scheduler')
          logger.setLevel(logging.INFO)
          logger.addHandler(logging.StreamHandler())
          logger.propagate = False
          from pricepilot.core.scheduler import run_cloud_pricing_cycle
          result = run_cloud_pricing_cycle(source='github_actions')
          print(json.dumps({
              'ok': result['ok'], 'accounts_processed': result['accounts_processed'],
              'runs': [{'account_id': item['account_id'], 'status': item['status'],
                        'run_id': (item.get('run') or {}).get('id'),
                        'decisions': item['decisions']} for item in result['results']]
          }))
          if result.get("ok") is not True or result.get("errors"):
              raise SystemExit("Pricing cycle incomplete; inspect authenticated operation logs.")
          print("Pricing cycle completed.")
          PY

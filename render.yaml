services:
  - type: web
    name: pricepilot-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pricepilot.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PRICEPILOT_ENV
        value: staging
      - key: PRICEPILOT_RUNTIME
        value: api
      - key: PRICEPILOT_DATABASE_BACKEND
        value: supabase
      - key: PRICEPILOT_DATA_PROVIDER
        value: unconfigured
      - key: PRICEPILOT_PRICING_BASIS
        value: calendar_only
      - key: PRICEPILOT_OPERATIONAL_MODE
        value: "1"
      - key: PRICEPILOT_OCCUPANCY_PROVIDER
        value: observed_inventory
      - key: PRICEPILOT_CHANNEL_PROVIDER
        value: beds24
      - key: PRICEPILOT_ALLOW_CHANNEL_WRITES
        value: "0"
      - key: PRICEPILOT_API_AUTH_REQUIRED
        value: "1"
      - key: PRICEPILOT_DEFAULT_ACCOUNT_ID
        value: "1"
      - key: APP_BASE_URL
        value: https://pricepilot-anto.streamlit.app
      - key: SUPABASE_AUTH_REDIRECT_URL
        value: https://pricepilot-anto.streamlit.app
      - key: SUPABASE_PASSWORD_RESET_REDIRECT_URL
        value: https://pricepilot-anto.streamlit.app
      - key: PRICEPILOT_CORS_ORIGINS
        value: https://pricepilot-anto.streamlit.app,http://localhost:8501
      - key: PRICEPILOT_ALLOW_LOCAL_AUTH
        value: "0"
      - key: PRICEPILOT_ALLOW_PAID_SIGNUP_WITHOUT_CHECKOUT
        value: "0"
      - key: PRICEPILOT_ALLOW_MANUAL_CYCLE
        value: "0"
      - key: PRICEPILOT_REQUIRE_TELEGRAM_WEBHOOK_SECRET
        value: "1"
      - key: PRICEPILOT_AUTO_REGISTER_TELEGRAM_WEBHOOK
        value: "0"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PRICEPILOT_API_BASE_URL
        sync: false
      - key: PRICEPILOT_API_KEY
        sync: false
      - key: PRICEPILOT_SCHEDULER_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PLUS
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
